<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freelancer: Przetrwanie 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        /* Animacje */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Pasek przewijania */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Mobile specific fixes */
        .touch-action-none { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

// --- SYSTEM AUDIO (SYNTEZATOR) ---

const AudioSystem = (() => {
    let audioCtx = null;
    let mainGain = null;
    let isMusicPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;

    const init = () => {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            mainGain = audioCtx.createGain();
            mainGain.connect(audioCtx.destination);
            mainGain.gain.value = 0.3;
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    };

    const playTone = (freq, type, duration, volume = 0.1, startTime = 0) => {
        if (!audioCtx) init();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
        g.gain.setValueAtTime(volume, audioCtx.currentTime + startTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
        osc.connect(g);
        g.connect(mainGain);
        osc.start(audioCtx.currentTime + startTime);
        osc.stop(audioCtx.currentTime + startTime + duration);
    };

    const scheduler = () => {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            if(isMusicPlaying) {
                const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C major pentatonic
                const note = notes[Math.floor(Math.random() * notes.length)];
                // Play soft background note
                playTone(note, 'sine', 1.5, 0.03, 0); 
                // Next note scheduling
                nextNoteTime += 1.0 + Math.random(); 
            } else {
                 nextNoteTime += 0.5;
            }
        }
        timerID = window.setTimeout(scheduler, 25.0);
    };

    return {
        init: () => init(),
        click: () => playTone(800, 'sine', 0.05, 0.05),
        work: () => {
            playTone(150, 'square', 0.05, 0.05, 0);
            playTone(200, 'square', 0.05, 0.05, 0.06);
            playTone(180, 'square', 0.05, 0.05, 0.12);
        },
        eat: () => playTone(220, 'triangle', 0.2, 0.1),
        sleep: () => {
             playTone(400, 'sine', 0.5, 0.05, 0);
             playTone(300, 'sine', 0.5, 0.05, 0.2);
        },
        buy: () => {
            playTone(523.25, 'sine', 0.1, 0.1, 0);
            playTone(659.25, 'sine', 0.1, 0.1, 0.1);
        },
        fail: () => {
            playTone(150, 'sawtooth', 0.4, 0.2, 0);
            playTone(130, 'sawtooth', 0.4, 0.2, 0.3);
            playTone(100, 'sawtooth', 0.8, 0.2, 0.6);
        },
        toggleMusic: (shouldPlay) => {
            init();
            isMusicPlaying = shouldPlay;
            if (shouldPlay && !timerID) {
                nextNoteTime = audioCtx.currentTime + 0.1;
                scheduler();
            }
        }
    };
})();

// --- DANE ---

const MONTHS = [
    "Sty", "Lut", "Mar", "Kwi", "Maj", "Cze",
    "Lip", "Sie", "Wrz", "Paź", "Lis", "Gru"
];

const INITIAL_ITEMS = [
    { id: 1, name: "Stary Laptop", sellPrice: 400, type: "essential", bonus: "Wymagany do pracy" },
    { id: 2, name: "Materac", sellPrice: 150, type: "comfort", bonus: "+Energia ze snu" },
    { id: 3, name: "Lodówka", sellPrice: 300, type: "food", bonus: "Tańsze jedzenie" },
    { id: 4, name: "Biurko", sellPrice: 200, type: "work", bonus: "Szybka praca" },
];

const UPGRADES = [
    { id: 'coffee', name: "Ekspres Kawowy", costXp: 50, effect: "Praca -1h", icon: "☕" },
    { id: 'course', name: "Kurs IT", costXp: 100, effect: "Zarobki +20%", icon: "📚" },
    { id: 'gym', name: "Siłownia", costXp: 80, effect: "Zdrowie +", icon: "💪" },
];

// --- UI KOMPONENTY ---

const ProgressBar = ({ label, value, max, color, icon }) => (
    <div className="mb-2 w-full">
        <div className="flex justify-between text-xs mb-1 font-semibold text-slate-300">
            <span className="flex items-center gap-1">{icon} {label}</span>
            <span>{Math.round(value)}%</span>
        </div>
        <div className="w-full bg-slate-700/50 rounded-full h-2.5 backdrop-blur-sm">
            <div 
                className={`h-2.5 rounded-full transition-all duration-500 shadow-md ${color}`} 
                style={{ width: `${Math.max(0, Math.min(100, (value/max)*100))}%` }}
            ></div>
        </div>
    </div>
);

const ActionButton = ({ onClick, icon, label, subLabel, disabled, variant = "primary" }) => {
    const handleClick = (e) => {
        if(!disabled) AudioSystem.click();
        if (onClick) onClick(e);
    };

    const variants = {
        primary: "bg-gradient-to-br from-blue-600 to-blue-700 active:from-blue-700 active:to-blue-800 shadow-blue-900/40",
        secondary: "bg-slate-700 active:bg-slate-600 border border-slate-600",
        danger: "bg-gradient-to-br from-red-600 to-red-700 active:from-red-700 active:to-red-800 shadow-red-900/40",
        warning: "bg-gradient-to-br from-amber-600 to-amber-700 active:from-amber-700 active:to-amber-800 shadow-amber-900/40"
    };
    
    return (
        <button 
            onClick={handleClick} 
            disabled={disabled} 
            className={`
                relative w-full p-3 rounded-xl font-bold transition-all transform active:scale-[0.98] 
                disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed touch-action-none
                flex flex-col items-center justify-center gap-1 shadow-lg
                ${variants[variant]}
            `}
            style={{ minHeight: '80px' }} // Duży cel dotyku
        >
            <span className="text-2xl drop-shadow-md">{icon}</span>
            <span className="text-sm leading-tight text-white drop-shadow-sm">{label}</span>
            {subLabel && <span className="text-[10px] text-white/70 font-normal">{subLabel}</span>}
        </button>
    );
};

const Modal = ({ title, children, overlayColor = "bg-black/80" }) => (
    <div className={`fixed inset-0 ${overlayColor} flex items-center justify-center z-50 p-4 backdrop-blur-md`}>
        <div className="bg-slate-800 border border-slate-600 rounded-2xl max-w-sm w-full p-6 shadow-2xl animate-[fadeIn_0.3s_ease-out]">
            <h2 className="text-2xl font-bold mb-4 text-white text-center">{title}</h2>
            <div className="text-slate-300 text-center">
                {children}
            </div>
        </div>
    </div>
);

// --- LOGIKA GRY ---

const App = () => {
    const [gameState, setGameState] = useState("start");
    const [gameOverReason, setGameOverReason] = useState("");
    const [musicOn, setMusicOn] = useState(false);
    
    const [date, setDate] = useState({ month: 0, day: 1, hour: 8 });
    const [money, setMoney] = useState(500);
    const [xp, setXp] = useState(0);

    const [energy, setEnergy] = useState(100);
    const [hunger, setHunger] = useState(0);
    const [mental, setMental] = useState(100);
    
    const [items, setItems] = useState(INITIAL_ITEMS);
    const [activeUpgrades, setActiveUpgrades] = useState([]);
    const [logs, setLogs] = useState(["Start gry. Masz 500 PLN."]);

    const log = (msg) => setLogs(prev => [msg, ...prev].slice(0, 4));

    useEffect(() => {
        AudioSystem.toggleMusic(musicOn && gameState === "playing");
        return () => AudioSystem.toggleMusic(false);
    }, [musicOn, gameState]);

    useEffect(() => {
        if (gameState === "gameover") AudioSystem.fail();
        if (gameState === "win") AudioSystem.buy();
    }, [gameState]);

    const startGame = () => {
        AudioSystem.init(); // Kluczowe dla iOS
        AudioSystem.click();
        setGameState("playing");
    };

    const advanceTime = (hours) => {
        let newHour = date.hour + hours;
        let newDay = date.day;
        let newMonth = date.month;
        let dayPassed = false;

        if (newHour >= 24) {
            newHour -= 24;
            newDay += 1;
            dayPassed = true;
        }

        if (newDay > 30) {
            newDay = 1;
            newMonth += 1;
            handleMonthlyBills();
        }

        if (newMonth > 11) {
            setGameState("win");
            return;
        }

        setDate({ month: newMonth, day: newDay, hour: newHour });

        if (dayPassed) {
            setMental(prev => Math.max(0, prev - 5));
            handleRandomEvent();
        }
    };

    const handleMonthlyBills = () => {
        const rent = 1800;
        const utilities = 300 + Math.floor(Math.random() * 100);
        const total = rent + utilities;
        
        setMoney(prev => {
            const next = prev - total;
            if (next < 0) {
                setGameState("debt");
                log(`💸 Opłaty: ${total} PLN. Dług!`);
            } else {
                log(`💸 Opłaty: ${total} PLN. Zapłacono.`);
            }
            return next;
        });
    };

    const handleRandomEvent = () => {
        if (Math.random() > 0.85) {
            const evs = [
                { txt: "Awaria! -150 PLN", m: -150 },
                { txt: "Znalazłeś 50 PLN!", m: 50 },
                { txt: "Klient dał napiwek +200 PLN", m: 200 }
            ];
            const e = evs[Math.floor(Math.random() * evs.length)];
            log(e.txt);
            if(e.m) setMoney(p => p + e.m);
        }
    };

    const handleWork = () => {
        if (energy <= 0) return log("Brak energii! Śpij.");
        if (hunger >= 100) return setGameState("gameover");
        if (!items.find(i => i.name === "Stary Laptop")) return log("Brak laptopa!");

        AudioSystem.work();
        const hasCoffee = activeUpgrades.includes('coffee');
        const hasCourse = activeUpgrades.includes('course');
        
        let earned = 150 + Math.floor(Math.random() * 50);
        if (hasCourse) earned = Math.floor(earned * 1.2);

        setMoney(p => p + earned);
        setXp(p => p + 10);
        setEnergy(p => Math.max(0, p - 30));
        setHunger(p => Math.min(100, p + 20));
        setMental(p => Math.max(0, p - 10));
        advanceTime(hasCoffee ? 3 : 4);
    };

    const handleAction = (type) => {
        if (type === 'sleep') {
            AudioSystem.sleep();
            const hasBed = items.find(i => i.name === "Materac");
            setEnergy(p => Math.min(100, p + (hasBed ? 80 : 40)));
            setHunger(p => Math.min(100, p + 15));
            advanceTime(8);
        } else if (type === 'eat_home') {
            AudioSystem.eat();
            const cost = items.find(i => i.name === "Lodówka") ? 20 : 40;
            if (money < cost) return log("Brak kasy!");
            setMoney(p => p - cost);
            setHunger(p => Math.max(0, p - 40));
            advanceTime(1);
        } else if (type === 'relax') {
            setMental(p => Math.min(100, p + 30));
            advanceTime(2);
        }
    };

    const sellItem = (item) => {
        AudioSystem.click();
        if(!confirm(`Sprzedać ${item.name}?`)) return;
        setMoney(p => {
            const n = p + item.sellPrice;
            if (gameState === "debt" && n >= 0) {
                setGameState("playing");
                log("Dług spłacony!");
            }
            return n;
        });
        setItems(p => p.filter(i => i.id !== item.id));
    };

    const buyUpgrade = (u) => {
        if(xp < u.costXp) return;
        AudioSystem.buy();
        setXp(p => p - u.costXp);
        setActiveUpgrades(p => [...p, u.id]);
    };

    // --- EKRAN STARTOWY ---
    if (gameState === "start") {
        return (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 to-slate-900">
                <div className="mb-8 p-4 bg-slate-800/50 rounded-full border border-slate-700 shadow-2xl">
                    <span className="text-6xl">🏢</span>
                </div>
                <h1 className="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
                    Freelancer 2026
                </h1>
                <p className="text-slate-400 mb-8 max-w-md text-lg leading-relaxed">
                    Symulator przetrwania finansowego. <br/>
                    Pracuj, płać rachunki, nie zbankrutuj.
                </p>
                <button 
                    onClick={startGame}
                    className="w-full max-w-xs py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-xl shadow-lg shadow-blue-900/50 transition-all active:scale-95"
                >
                    Rozpocznij
                </button>
                <div className="mt-8 text-slate-500 text-xs font-mono">
                    Autor: <a href="https://linktr.ee/kitadamian" target="_blank" rel="noopener noreferrer" className="hover:text-blue-400 transition-colors underline">Damian Kita</a>
                </div>
            </div>
        );
    }

    if (gameState === "gameover" || gameState === "win") {
        return (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center bg-slate-900">
                <div className="text-6xl mb-4">{gameState === "win" ? "🎉" : "💀"}</div>
                <h2 className={`text-3xl font-bold mb-4 ${gameState === "win" ? "text-emerald-400" : "text-red-500"}`}>
                    {gameState === "win" ? "Przetrwałeś!" : "Koniec Gry"}
                </h2>
                <p className="text-slate-300 mb-8">{gameOverReason || "Gratulacje!"}</p>
                <button 
                    onClick={() => window.location.reload()}
                    className="px-8 py-3 bg-slate-700 rounded-lg font-bold"
                >
                    Menu Główne
                </button>
            </div>
        );
    }

    // --- EKRAN GRY (RESPONSYWNY) ---
    return (
        <div className="max-w-5xl mx-auto min-h-screen flex flex-col md:p-4">
            
            {/* STICKY HEADER - Zawsze widoczny na górze */}
            <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 shadow-lg px-4 py-3 flex justify-between items-center md:rounded-xl md:top-4 md:mb-6">
                <div className="flex flex-col">
                    <div className="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-wider">
                        <span>🗓 {date.day} {MONTHS[date.month]}</span>
                        <span>⏰ {date.hour}:00</span>
                    </div>
                    <div className={`text-xl font-mono font-bold ${money < 0 ? 'text-red-500 animate-pulse' : 'text-emerald-400'}`}>
                        {money} PLN
                    </div>
                </div>
                
                <div className="flex items-center gap-3">
                     <div className="text-right hidden sm:block">
                        <div className="text-[10px] text-slate-500 uppercase">Doświadczenie</div>
                        <div className="text-purple-400 font-bold">{xp} XP</div>
                    </div>
                    <button 
                        onClick={() => setMusicOn(!musicOn)}
                        className={`p-2 rounded-full border transition-colors ${musicOn ? 'border-blue-500 text-blue-400 bg-blue-900/20' : 'border-slate-600 text-slate-600'}`}
                    >
                        {musicOn ? '🔊' : '🔇'}
                    </button>
                </div>
            </header>

            <main className="flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-6 pb-24 md:pb-4">
                
                {/* KOLUMNA 1: STATYSTYKI & LOGI (Mobile: pod akcjami, Desktop: Lewa strona) */}
                <div className="md:col-span-4 flex flex-col gap-4 order-2 md:order-1">
                     <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                        <ProgressBar label="Energia" value={energy} max={100} color="bg-yellow-400" icon="⚡" />
                        <ProgressBar label="Głód" value={hunger} max={100} color="bg-orange-500" icon="🍗" />
                        <ProgressBar label="Psychika" value={mental} max={100} color="bg-indigo-400" icon="🧠" />
                    </div>

                    <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 h-32 overflow-hidden flex flex-col relative">
                        <div className="absolute top-0 left-0 right-0 h-4 bg-gradient-to-b from-slate-800 to-transparent z-10"></div>
                        <div className="flex-1 overflow-y-auto space-y-2 p-1 text-xs">
                            {logs.map((l, i) => (
                                <div key={i} className="text-slate-300 border-l-2 border-slate-600 pl-2 py-0.5">{l}</div>
                            ))}
                        </div>
                        <div className="absolute bottom-0 left-0 right-0 h-6 bg-gradient-to-t from-slate-800 to-transparent z-10"></div>
                    </div>
                </div>

                {/* KOLUMNA 2: GŁÓWNE AKCJE (Mobile: Góra, Desktop: Środek) */}
                <div className="md:col-span-5 order-1 md:order-2">
                    <div className="grid grid-cols-2 gap-3 mb-2">
                        <ActionButton 
                            onClick={handleWork} 
                            disabled={gameState === 'debt'} 
                            icon="💻" label="Pracuj" subLabel="+$$$ -Energia"
                        />
                         <ActionButton 
                            onClick={() => handleAction('sleep')} 
                            disabled={gameState === 'debt'} 
                            variant="secondary"
                            icon="💤" label="Śpij" subLabel="+Energia"
                        />
                        <ActionButton 
                            onClick={() => handleAction('eat_home')} 
                            disabled={gameState === 'debt'} 
                            variant="warning"
                            icon="🥪" label="Zjedz" subLabel="-$$"
                        />
                         <ActionButton 
                            onClick={() => handleAction('relax')} 
                            disabled={gameState === 'debt'} 
                            variant="secondary"
                            icon="🎮" label="Relaks" subLabel="+Psychika"
                        />
                    </div>
                </div>

                {/* KOLUMNA 3: EKWIPUNEK I SKLEP (Mobile: Dół, Desktop: Prawa strona) */}
                <div className="md:col-span-3 space-y-4 order-3">
                    
                    {/* Mieszkanie */}
                    <div className={`bg-slate-800 p-4 rounded-xl border transition-colors ${gameState === 'debt' ? 'border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.3)] animate-pulse' : 'border-slate-700'}`}>
                        <h3 className="text-xs font-bold text-slate-400 uppercase mb-3 flex justify-between">
                            Mieszkanie
                            {gameState === 'debt' && <span className="text-red-400">SPRZEDAJ COŚ!</span>}
                        </h3>
                        <div className="grid grid-cols-2 md:grid-cols-1 gap-2">
                            {items.map(item => (
                                <div key={item.id} className="bg-slate-700/50 p-2 rounded border border-slate-600/50 flex flex-col justify-between">
                                    <span className="text-xs font-bold text-slate-200 truncate">{item.name}</span>
                                    <button 
                                        onClick={() => sellItem(item)}
                                        className="mt-2 w-full bg-slate-600 hover:bg-red-600 text-[10px] py-1.5 rounded text-white transition-colors"
                                    >
                                        Sprzedaj (+{item.sellPrice})
                                    </button>
                                </div>
                            ))}
                            {items.length === 0 && <div className="text-xs text-slate-500 text-center italic py-2">Pusto...</div>}
                        </div>
                    </div>

                    {/* Ulepszenia */}
                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                         <h3 className="text-xs font-bold text-slate-400 uppercase mb-3 flex justify-between items-center">
                            Rozwój <span className="text-purple-400">{xp} XP</span>
                        </h3>
                        <div className="space-y-2">
                            {UPGRADES.map(u => {
                                const bought = activeUpgrades.includes(u.id);
                                return (
                                    <div key={u.id} className="flex items-center justify-between bg-slate-700/30 p-2 rounded border border-slate-600/30">
                                        <div className="flex items-center gap-2">
                                            <span className="text-lg">{u.icon}</span>
                                            <div className="flex flex-col">
                                                <span className={`text-xs font-bold ${bought ? 'text-emerald-400' : 'text-slate-300'}`}>{u.name}</span>
                                                <span className="text-[9px] text-slate-500">{u.effect}</span>
                                            </div>
                                        </div>
                                        {!bought && (
                                            <button 
                                                onClick={() => buyUpgrade(u)}
                                                disabled={xp < u.costXp}
                                                className="bg-purple-600 disabled:bg-slate-700 text-[10px] px-2 py-1 rounded text-white"
                                            >
                                                {u.costXp} XP
                                            </button>
                                        )}
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                </div>

            </main>

            <footer className="text-center py-2 text-[10px] text-slate-600">
                Autor: <a href="https://linktr.ee/kitadamian" target="_blank" rel="noopener noreferrer" className="hover:text-blue-400 transition-colors">Damian Kita</a>
            </footer>

            {gameState === 'debt' && (
                <Modal title="⚠️ BANKRUCTWO">
                    <p className="mb-4">Konto na minusie! Brakuje <span className="text-red-400 font-bold">{Math.abs(money)} PLN</span>.</p>
                    <p className="text-sm text-slate-400">Sprzedaj przedmioty z sekcji "Mieszkanie" aby spłacić dług.</p>
                </Modal>
            )}

        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
